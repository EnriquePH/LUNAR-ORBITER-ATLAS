[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-orbiter"
version = "0.1.0"
description = "Interactive 3D atlas of Lunar Orbiter photographs from the LPI archive"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ENERGYCODE", email = "energycode.org@gmail.com" }]
maintainers = [{ name = "ENERGYCODE", email = "energycode.org@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "dash>=4.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "plotly>=5.22",
    "requests>=2.31",
]

[project.scripts]
lunar-orbiter = "orbiter.app:main"

[project.urls]
Homepage = "https://www.energycode.org/"
Repository = "https://github.com/EnriquePH/LUNAR-ORBITER-ATLAS"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["orbiter*"]

[tool.setuptools.package-data]
orbiter = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "FURB", "C4"]