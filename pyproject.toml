[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-orbiter"
version = "0.1.0"
description = "Utilities for exploring data from the Lunar Orbiter archive"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12",
    "dash>=4.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "plotly>=5.22",
    "requests>=2.31",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "pandas>=2.1",
    "tqdm>=4.66",
]
dev = [
    "lunar-orbiter[notebook]",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["orbiter*"]

[tool.setuptools.package-data]
orbiter = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["LUNAR ORBITER.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "FURB", "C4"]